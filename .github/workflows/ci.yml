name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Настроить Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Настроить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: gofmt
        run: |
          $bad = gofmt -l .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($bad) {
            Write-Host "::error::Эти файлы не отформатированы (gofmt -w .):"
            Write-Host $bad
            exit 1
          }

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...
        continue-on-error: true

      - name: go test
        run: go test ./...

      - name: Фронтенд
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build