name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Настроить Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: wails build
        run: wails build

      - name: Переименовать артефакт
        run: |
          $file = "AudioControl-${{ github.ref_name }}-windows-amd64.exe"
          Move-Item build/bin/AudioControl.exe $file
          Get-Item $file | Format-List Name, Length

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" "AudioControl-${{ github.ref_name }}-windows-amd64.exe" --clobber